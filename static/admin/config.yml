# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: RheaPrad/website

media_folder: src/lib/content
public_folder: /src/lib/content
site_url: https://rheaprad.netlify.app
logout_redirect_url: https://rheaprad.netlify.app
logo:
  src: /portrait_r.webp
  show_in_header: true
collections:
  - name: books
    label: Books
    folder: src/lib/content/art-page/books
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - {
          label: Category,
          name: category,
          widget: select,
          default: Miscellany,
          options:
            [
              "Artist Books",
              "Picture Books",
              "Graphic Novels",
              "Miscellany",
            ],
        }
      - {
          label: Pages,
          name: pages,
          widget: string,
          required: false,
          hint: "e.g. 120",
        }
      - {
          label: Dimensions,
          name: dimensions,
          widget: string,
          required: false,
          hint: "e.g. 18 × 23.5cm",
        }
      - {
          label: Grid Cover (books index),
          name: cover_image,
          widget: image,
        }
      - {
          label: Hero Image (top of detail page),
          name: hero_image,
          widget: image,
          required: false,
          hint: "Full-bleed image at the top of the book's page. Falls back to the cover.",
        }
      - {
          label: Title Colour override,
          name: title_color,
          widget: string,
          required: false,
          hint: "Optional CSS colour. Leave blank to auto-pull the dominant colour from the hero.",
        }
      - {
          label: Nav Text on Hero,
          name: nav_theme,
          widget: select,
          default: Auto,
          options: ["Auto", "Light text", "Dark text"],
        }
      - {
          label: Gallery,
          name: gallery,
          widget: list,
          field: { label: Image, name: image, widget: image },
        }
      - {
          label: Other Projects,
          name: other_projects,
          widget: relation,
          required: false,
          multiple: true,
          collection: books,
          value_field: "{{slug}}",
          search_fields: ["title"],
          display_fields: ["title"],
          hint: "Leave empty to show the 3 most recent books.",
        }
      - { label: Description, name: body, widget: markdown }

  - name: comics
    label: Comics
    folder: src/lib/content/art-page/comics
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image }

  - name: blog
    label: Blog
    folder: src/lib/content/blog-page
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string, required: false }
      - { label: Date, name: date, widget: datetime }
      - {
          label: Description,
          name: description,
          widget: string,
          required: false,
        }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: home
    label: Home
    files:
      - name: home
        label: Home Page
        file: src/lib/content/home-page/home.md
        fields:
          - {
              label: Featured Book Cover,
              name: featured_book,
              widget: image,
              required: false,
            }
          - {
              label: Featured Comic Cover,
              name: featured_comic,
              widget: image,
              required: false,
            }
          - label: Carousel
            name: carousel
            widget: list
            label_singular: Slide
            summary: "{{fields.caption}}"
            fields:
              - { label: Image, name: image, widget: image }
              - {
                  label: Caption,
                  name: caption,
                  widget: string,
                  required: false,
                }

  - name: about
    label: About
    files:
      - name: about
        label: About Page
        file: src/lib/content/about-page/about.md
        fields:
          - { label: Photo, name: photo, widget: image }
          - {
              label: Photo Caption,
              name: photo_caption,
              widget: string,
              required: false,
              hint: "Italic caption shown under the photo.",
            }
          - {
              label: Resume,
              name: resume,
              widget: file,
              required: false,
              hint: "PDF or link the RESUME button points to.",
            }
          - {
              label: LinkedIn URL,
              name: linkedin,
              widget: string,
              required: false,
            }
          - { label: Email, name: email, widget: string, required: false }
          - {
              label: Instagram URL,
              name: instagram,
              widget: string,
              required: false,
            }
          - {
              label: BlueSky URL,
              name: bluesky,
              widget: string,
              required: false,
            }
          - {
              label: Behance URL,
              name: behance,
              widget: string,
              required: false,
            }
          - { label: Bio, name: body, widget: markdown }
